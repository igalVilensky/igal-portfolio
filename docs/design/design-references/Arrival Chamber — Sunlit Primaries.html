<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arrival Chamber — Sunlit Primaries</title>
<style>
:root{--bg:#f4ecdc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110d}}
html,body{margin:0;background:var(--bg)}
main{max-width:1600px;margin:0 auto;padding:16px}
.frame{aspect-ratio:16/9;width:100%;overflow:hidden;border-radius:4px;box-shadow:0 16px 46px rgba(60,30,0,.3)}
svg{display:block;width:100%;height:100%}
</style></head><body><main><div class="frame" id="f"></div></main>
<script>
let rings='';
[[.2,.9],[.34,.95],[.56,1],[.95,1]].forEach(([s,o])=>{
rings+=`<g transform="translate(900 500) scale(${s})">
<path d="M-800 400V-200Q-800 -540 0 -540Q800 -540 800 -200V400" fill="none" stroke="#1f46c8" stroke-width="120"/>
<path d="M-740 400V-200Q-740 -480 0 -480Q740 -480 740 -200V400" fill="none" stroke="#6b94f7" stroke-width="12"/>
<path d="M-860 400V-200Q-860 -600 0 -600Q860 -600 860 -200V400" fill="none" stroke="#0f2a86" stroke-width="12"/></g>`});
let fins='';
[[1090,14,'#2fae52'],[1170,20,'#2fae52'],[1270,28,'#ffc21a'],[1400,40,'#2fae52'],[1570,58,'#e63a22']].forEach(([x,w,c])=>{
const dx=x-900,t=500-.25*dx*.92,b=500+.5*dx;
fins+=`<rect x="${x-w*.7}" y="${t+(b-t)*.04}" width="${w*.7}" height="${(b-t)*.92}" fill="#3a2410" opacity=".16" filter="url(#bl)"/>
<rect x="${x}" y="${t}" width="${w}" height="${b-t}" fill="${c}"/>
<rect x="${x}" y="${t}" width="${w*.22}" height="${b-t}" fill="#fff" opacity=".35"/>
<rect x="${x}" y="${b-6}" width="${w}" height="6" fill="#000" opacity=".15"/>`});
let joints='';
for(let i=-8;i<=10;i++)joints+=`<line x1="900" y1="500" x2="${900+i*260}" y2="1200" stroke="#7a4a1c" stroke-opacity=".16" stroke-width="1.4"/>`;
[560,590,640,720,840].forEach(y=>joints+=`<line x1="0" y1="${y}" x2="1600" y2="${y}" stroke="#7a4a1c" stroke-opacity=".16" stroke-width="1.2"/>`);
document.getElementById('f').innerHTML=`<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="vg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9ccff"/><stop offset=".6" stop-color="#e6efff"/><stop offset="1" stop-color="#fff1d2"/></linearGradient>
<linearGradient id="wl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff0d6"/><stop offset="1" stop-color="#fffaf0"/></linearGradient>
<linearGradient id="wr" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#f9e2bd"/><stop offset="1" stop-color="#fff8ec"/></linearGradient>
<linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4dc"/><stop offset="1" stop-color="#ecc98c"/></linearGradient>
<linearGradient id="rn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd84a"/><stop offset="1" stop-color="#f5a800"/></linearGradient>
<linearGradient id="sl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a3a"/><stop offset="1" stop-color="#c92a12"/></linearGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#ffe9a0" stop-opacity="1"/><stop offset="1" stop-color="#ffd24a" stop-opacity="0"/></radialGradient>
<radialGradient id="dr" cx=".5" cy=".7" r=".7"><stop offset="0" stop-color="#fffdf2"/><stop offset=".6" stop-color="#ffe9a8"/><stop offset="1" stop-color="#ffc21a"/></radialGradient>
<linearGradient id="rf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0" stop-opacity=".95"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></linearGradient>
<linearGradient id="bm" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffe27a" stop-opacity=".95"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a0" stop-opacity=".5"/><stop offset="1" stop-color="#fff0a0" stop-opacity=".05"/></linearGradient>
<radialGradient id="vi" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#3a1a00" stop-opacity="0"/><stop offset="1" stop-color="#3a1a00" stop-opacity=".3"/></radialGradient>
<filter id="bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="bs"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="nz"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/></filter>
<clipPath id="fc"><polygon points="-200,1050 2000,1050 1060,580 740,580"/></clipPath>
</defs>
<rect width="1600" height="900" fill="url(#vg)"/>
<ellipse cx="840" cy="300" rx="560" ry="260" fill="url(#sun)" opacity=".6"/>
<polygon points="-200,1050 740,580 740,460 -200,225" fill="url(#wl)"/>
<polygon points="2000,1050 1060,580 1060,460 2000,225" fill="url(#wr)"/>
<ellipse cx="360" cy="330" rx="300" ry="200" fill="url(#sun)" opacity=".75"/>
<ellipse cx="1440" cy="470" rx="240" ry="280" fill="url(#sun)" opacity=".8"/>
<g transform="translate(250 668) skewY(-14.6)"><ellipse rx="52" ry="150" fill="#ffc21a"/><ellipse rx="34" ry="98" fill="#e63a22"/><ellipse rx="17" ry="48" fill="#fff6e3"/></g>
<polygon points="-200,1050 2000,1050 1060,580 740,580" fill="url(#fl)"/>
<g clip-path="url(#fc)">
<polygon points="560,900 1240,900 968,580 832,580" fill="url(#rn)"/>
<polygon points="560,900 575,900 838,580 832,580" fill="#1f46c8"/><polygon points="1225,900 1240,900 968,580 962,580" fill="#1f46c8"/>
${joints}
<rect x="-200" y="636" width="2200" height="20" fill="#1f46c8" opacity=".2" filter="url(#bs)"/>
<rect x="-200" y="724" width="2200" height="30" fill="#1f46c8" opacity=".22" filter="url(#bl)"/>
<rect x="-200" y="880" width="2200" height="40" fill="#1f46c8" opacity=".22" filter="url(#bl)"/>
<polygon points="400,900 790,900 900,680 800,680" fill="url(#bm)" filter="url(#bl)" opacity=".9"/>
<rect x="858" y="580" width="84" height="200" fill="url(#rf)" filter="url(#bs)"/>
</g>
<path d="M740 580V460Q740 392 900 392Q1060 392 1060 460V580Z" fill="#fff6e3"/>
<circle cx="900" cy="426" r="20" fill="#e63a22"/>
<path d="M850 580V510Q850 456 900 456Q950 456 950 510V580Z" fill="#ffc21a"/>
<path d="M862 580V512Q862 468 900 468Q938 468 938 510V580Z" fill="url(#dr)"/>
<ellipse cx="900" cy="580" rx="40" ry="20" fill="#3fbf5f" opacity=".9"/>
<ellipse cx="900" cy="545" rx="130" ry="90" fill="#fff0a0" opacity=".35" filter="url(#bl)"/>
${rings}
<polygon points="750,-40 800,-40 874,394 862,394" fill="#fff6c8" filter="url(#bs)"/>
<polygon points="750,-40 790,-40 870,394 862,394" fill="#fffef2"/>
<polygon points="750,-40 800,-40 760,900 420,900" fill="url(#sh)" filter="url(#bl)"/>
<polygon points="-200,330 740,475 740,503 -200,520" fill="url(#sl)"/>
<polygon points="-200,330 740,475 740,479 -200,336" fill="#ffb199"/>
<polygon points="-200,520 740,503 740,560 -200,700" fill="#3a1a00" opacity=".28" filter="url(#bl)"/>
${fins}
<line x1="-200" y1="1050" x2="740" y2="580" stroke="#6a3a10" stroke-width="16" opacity=".22" filter="url(#bl)"/>
<line x1="2000" y1="1050" x2="1060" y2="580" stroke="#6a3a10" stroke-width="16" opacity=".22" filter="url(#bl)"/>
<g><polygon points="296,636 376,622 376,784 296,796" fill="#1f46c8"/>
<polygon points="304,646 368,635 368,700 304,712" fill="#fff6e3"/>
<polygon points="304,720 350,712 350,726 304,734" fill="#ffc21a"/>
<polygon points="296,636 376,622 376,627 296,641" fill="#6b94f7"/>
<ellipse cx="336" cy="797" rx="64" ry="11" fill="#3a1a00" opacity=".3" filter="url(#bs)"/></g>
<g><polygon points="1440,640 1534,626 1534,810 1440,826" fill="#2fae52"/>
<polygon points="1450,652 1524,642 1524,780 1450,792" fill="#fffaf0"/>
<polyline points="1456,770 1476,728 1494,748 1512,690" fill="none" stroke="#e63a22" stroke-width="5"/>
<polygon points="1440,640 1534,626 1534,631 1440,646" fill="#7fe09a"/>
<ellipse cx="1490" cy="826" rx="80" ry="12" fill="#3a1a00" opacity=".3" filter="url(#bs)"/></g>
<rect width="1600" height="900" filter="url(#nz)" opacity=".12" style="mix-blend-mode:multiply"/>
<rect width="1600" height="900" fill="url(#vi)"/>
</svg>`;
</script></body></html>
